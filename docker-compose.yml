services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./resona.db
      - CORS_ORIGINS=["http://localhost:8501"]
    volumes:
      # Live code edits without a rebuild.
      - ./apps/api/app:/resona/apps/api/app
      - ./ml:/resona/ml
      # Trained models and datasets are large/gitignored and produced by
      # the local pipeline scripts (see README) — mounted read-only rather
      # than baked into the image.
      - ./models:/resona/models:ro
      - ./data:/resona/data:ro

  streamlit:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - RESONA_API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./streamlit_app:/app
