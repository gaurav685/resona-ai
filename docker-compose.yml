services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./resona.db
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      # Live code edits without a rebuild.
      - ./apps/api/app:/resona/apps/api/app
      - ./ml:/resona/ml
      # Trained models and datasets are large/gitignored and produced by
      # the local pipeline scripts (see README) — mounted read-only rather
      # than baked into the image.
      - ./models:/resona/models:ro
      - ./data:/resona/data:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
